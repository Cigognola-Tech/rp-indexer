# Deploy rp-indexer to AWS Elastic Beanstalk via ECR (production branch only).
#
# Required GitHub Environment "production" variables
# (Settings → Environments → production → Environment variables):
#   AWS_REGION            e.g. us-east-1
#   AWS_ACCOUNT_ID        12-digit AWS account ID (ECR registry host)
#   ECR_REPOSITORY        e.g. rapidpro-production/rp-indexer
#   EB_APPLICATION_NAME   Elastic Beanstalk application name (same as RapidPro)
#   EB_ENVIRONMENT        e.g. rapidpro-production-rp-indexer
#
# Required GitHub Environment "production" secrets:
#   AWS_ACCESS_KEY_ID      IAM user access key ID
#   AWS_SECRET_ACCESS_KEY  IAM user secret access key
#
# IAM user permissions (minimum):
#   - ecr:GetAuthorizationToken
#   - ecr:BatchCheckLayerAvailability, ecr:CompleteLayerUpload, ecr:InitiateLayerUpload,
#     ecr:PutImage, ecr:UploadLayerPart, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer
#     (scoped to the ECR repository)
#   - s3:PutObject, s3:GetObject, s3:ListBucket on the EB application versions bucket
#   - elasticbeanstalk:CreateApplicationVersion, elasticbeanstalk:UpdateEnvironment,
#     elasticbeanstalk:DescribeEnvironments, elasticbeanstalk:DescribeEvents,
#     elasticbeanstalk:DescribeApplicationVersions
#
# EB instance profile must allow ECR pull.
# App runtime env vars (INDEXER_DB, INDEXER_ELASTIC_URL, etc.) are configured on the
# EB environment itself — not in this workflow.

name: Deploy Production

on:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version_label: ${{ steps.meta.outputs.version_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          missing=0
          require_var() {
            local name="$1" value="$2"
            if [ -z "${value}" ]; then
              echo "::error::Missing GitHub Environment variable (production): ${name}"
              missing=1
            else
              echo "OK: ${name}"
            fi
          }
          require_secret() {
            local name="$1" value="$2"
            if [ -z "${value}" ]; then
              echo "::error::Missing GitHub Environment secret (production): ${name}"
              missing=1
            else
              echo "OK: ${name} (set)"
            fi
          }
          require_var AWS_REGION "${{ vars.AWS_REGION }}"
          require_var AWS_ACCOUNT_ID "${{ vars.AWS_ACCOUNT_ID }}"
          require_var ECR_REPOSITORY "${{ vars.ECR_REPOSITORY }}"
          require_var EB_APPLICATION_NAME "${{ vars.EB_APPLICATION_NAME }}"
          require_var EB_ENVIRONMENT "${{ vars.EB_ENVIRONMENT }}"
          require_secret AWS_ACCESS_KEY_ID "${{ secrets.AWS_ACCESS_KEY_ID }}"
          require_secret AWS_SECRET_ACCESS_KEY "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          if [ "${missing}" -ne 0 ]; then
            echo "::error::Set the variables/secrets above under Settings → Environments → production, then re-run."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version_label=indexer-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${GITHUB_SHA},${IMAGE}:production" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package Dockerrun bundle
        env:
          ECR_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
        run: |
          WORKDIR=$(mktemp -d)
          cp -R deploy/eb/. "${WORKDIR}/"
          while IFS= read -r -d '' file; do
            sed -i "s|\${ECR_IMAGE}|${ECR_IMAGE}|g" "${file}"
          done < <(find "${WORKDIR}" \( -name 'Dockerrun.aws.json' -o -name 'docker-compose.yml' \) -print0)
          (cd "${WORKDIR}" && zip -qr "${GITHUB_WORKSPACE}/rp-indexer.zip" .)
          echo "Bundled rp-indexer.zip with image ${ECR_IMAGE}"
          unzip -l "${GITHUB_WORKSPACE}/rp-indexer.zip"
          echo "--- Dockerrun.aws.json ---"
          cat "${WORKDIR}/Dockerrun.aws.json" 2>/dev/null || true
          echo "--- docker-compose.yml ---"
          cat "${WORKDIR}/docker-compose.yml" 2>/dev/null || true

      - name: Upload version to S3 and create application version
        run: |
          ACCOUNT_ID="${{ env.AWS_ACCOUNT_ID }}"
          REGION="${{ env.AWS_REGION }}"
          APP="${{ env.EB_APPLICATION_NAME }}"
          VERSION="${{ needs.build-and-push.outputs.version_label }}"
          BUCKET="elasticbeanstalk-${REGION}-${ACCOUNT_ID}"
          KEY="${APP}/${VERSION}.zip"

          aws s3 cp rp-indexer.zip "s3://${BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "${APP}" \
            --version-label "${VERSION}" \
            --description "Deploy ${{ github.sha }} (rp-indexer) from ${{ github.ref_name }}" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${KEY}" \
            --process

          for i in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-application-versions \
              --application-name "${APP}" \
              --version-labels "${VERSION}" \
              --query 'ApplicationVersions[0].Status' \
              --output text)
            echo "Application version ${VERSION} status: ${STATUS}"
            if [ "${STATUS}" = "PROCESSED" ]; then
              break
            fi
            if [ "${STATUS}" = "FAILED" ]; then
              echo "Application version processing failed"
              exit 1
            fi
            sleep 5
          done
          if [ "${STATUS}" != "PROCESSED" ]; then
            echo "Timed out waiting for application version ${VERSION} to process"
            exit 1
          fi

      - name: Update environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --environment-name "${{ env.EB_ENVIRONMENT }}" \
            --version-label "${{ needs.build-and-push.outputs.version_label }}"
          echo "Deploy triggered for ${{ env.EB_ENVIRONMENT }} → ${{ needs.build-and-push.outputs.version_label }} (not waiting for Ready/Green)"
